<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Files changed — {{PLAN_NAME}}</title>
<style>
  :root {
    --bg: #ffffff;
    --page: #f6f8fa;
    --line: #d0d7de;
    --text: #1f2328;
    --muted: #656d76;
    --add: #1a7f37;
    --add-bg: #e6ffec;
    --add-num: #ccffd8;
    --del: #cf222e;
    --del-bg: #ffebe9;
    --del-num: #ffd7d5;
    --hunk: #656d76;
    --hunk-bg: #ddf4ff;
    --select: #fff8c5;
    --link: #0969da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--page);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 20px 28px 16px;
  }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin: 0; color: var(--muted); max-width: 760px; }
  .stats { margin: 10px 0 0; font-weight: 600; }
  .add { color: var(--add); }
  .del { color: var(--del); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--page);
    color: var(--muted);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .layout { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 132px); }
  aside {
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow: auto;
  }
  .tree-label {
    margin: 0;
    padding: 14px 16px 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .folder {
    padding: 10px 16px 2px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
  }
  button.file {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 0;
    border-top: 1px solid transparent;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 7px 16px 7px 28px;
    cursor: pointer;
  }
  button.file:hover { background: #f6f8fa; }
  button.file[aria-current="true"] { background: var(--select); }
  .mark { font-weight: 700; font-size: 13px; }
  .mark.m { color: #9a6700; }
  .mark.a { color: var(--add); }
  .mark.d { color: var(--del); }
  .fname { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .count { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }
  main { overflow: auto; background: var(--bg); }
  .diff-head {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 12px;
    z-index: 1;
  }
  .diff-head h2 {
    margin: 0;
    font-size: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
  }
  .why { margin: 6px 0 0; color: var(--muted); }
  .sketch {
    margin: 8px 0 0;
    color: var(--link);
    font-size: 12px;
  }
  .diff { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; }
  .row { display: grid; grid-template-columns: 48px 20px 1fr; }
  .row span { padding: 0 8px; white-space: pre-wrap; }
  .row .gutter { text-align: right; color: #8c959f; user-select: none; }
  .row.add { background: var(--add-bg); }
  .row.add .gutter { background: var(--add-num); color: var(--add); }
  .row.del { background: var(--del-bg); }
  .row.del .gutter { background: var(--del-num); color: var(--del); }
  .row.hunk { background: var(--hunk-bg); color: var(--hunk); }
  .row.hunk span { grid-column: 1 / -1; padding: 6px 12px; }
  .sign { user-select: none; color: inherit; font-weight: 700; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Files changed</h1>
  <p class="sub">{{PLAN_ONE_LINER}} Nothing here is merged code. Open a file to read the behavior in fake diff form.</p>
  <p class="stats"><span id="stats"></span></p>
  <div class="chips">
    <span class="chip">{{NOT_IN_THIS_DIFF}}</span>
    <span class="chip">{{NOT_IN_THIS_DIFF}}</span>
    <span class="chip">{{NOT_IN_THIS_DIFF}}</span>
  </div>
</header>
<div class="layout">
  <aside>
    <p class="tree-label">FILE TREE</p>
    <div id="tree"></div>
  </aside>
  <main>
    <div class="diff-head">
      <h2 id="path"></h2>
      <p class="why" id="why"></p>
      <p class="sketch">Sketch of the real diff. Green is new behavior. Red is behavior we stop doing.</p>
    </div>
    <div class="diff" id="diff"></div>
  </main>
</div>
<script>
// Fill every {{TOKEN}}. Copy the object once per file. Delete this comment.
// status is A, M, or D. add and del are numbers.
// A hunk is a blue @@ section @@. Indent like a diff.
// A line is a sentence, or a short code line when that is easier to read.
const files = [
  {
    folder: "{{REAL_FOLDER}}",
    name: "{{REAL_FILENAME}}",
    status: "{{A_M_OR_D}}",
    add: {{ROUGH_ADD}},
    del: {{ROUGH_DEL}},
    why: "{{WHY_FOR_A_PRODUCT_READER}}",
    lines: [
      { t: "hunk", text: "@@ {{SECTION}} @@" },
      { t: "ctx", text: "{{LINE_THAT_STAYS}}" },
      { t: "del", text: "{{LINE_THAT_STOPS}}" },
      { t: "add", text: "{{NEW_LINE}}" },
      { t: "add", text: "  {{INDENTED_LINE}}" },
    ],
  },
];

const stats = document.getElementById("stats");
const added = files.reduce((sum, file) => sum + (file.add || 0), 0);
const removed = files.reduce((sum, file) => sum + (file.del || 0), 0);
stats.innerHTML = files.length + ' files changed <span class="add">+' + added + '</span> <span class="del">−' + removed + "</span>";

const tree = document.getElementById("tree");
const diff = document.getElementById("diff");
const pathEl = document.getElementById("path");
const whyEl = document.getElementById("why");
let folders = [];
let selected = files.reduce((best, file, index) => (file.add || 0) > (files[best].add || 0) ? index : best, 0);

function count(file) {
  const bits = [];
  if (file.add) bits.push('<span class="add">+' + file.add + "</span>");
  if (file.del) bits.push('<span class="del">−' + file.del + "</span>");
  return bits.join(" ");
}

files.forEach((file, index) => {
  if (!folders.length || folders[folders.length - 1].name !== file.folder) {
    const block = document.createElement("div");
    const label = document.createElement("div");
    label.className = "folder";
    label.textContent = file.folder;
    block.appendChild(label);
    tree.appendChild(block);
    folders.push({ name: file.folder, block });
  }
  const button = document.createElement("button");
  button.type = "button";
  button.className = "file";
  button.innerHTML =
    '<span class="mark ' + file.status.toLowerCase() + '">' + file.status + "</span>" +
    '<span class="fname">' + file.name + "</span>" +
    '<span class="count">' + count(file) + "</span>";
  button.addEventListener("click", () => show(index));
  folders[folders.length - 1].block.appendChild(button);
  file.button = button;
});

function show(index) {
  selected = index;
  const file = files[index];
  files.forEach((item) => item.button.setAttribute("aria-current", item === file ? "true" : "false"));
  pathEl.textContent = file.folder + "/" + file.name;
  whyEl.textContent = file.why;
  diff.replaceChildren();
  let n = 1;
  file.lines.forEach((line) => {
    const row = document.createElement("div");
    row.className = "row " + line.t;
    if (line.t === "hunk") {
      row.innerHTML = "<span>" + line.text + "</span>";
    } else {
      const sign = line.t === "add" ? "+" : line.t === "del" ? "−" : " ";
      row.innerHTML =
        '<span class="gutter">' + (line.t === "del" ? "" : n++) + "</span>" +
        '<span class="sign">' + sign + "</span>" +
        "<span>" + line.text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
    }
    diff.appendChild(row);
  });
}

if (files.length) show(selected);
</script>
</body>
</html>
